id: p008
domain: organic
type: reasoning
skeleton_source: ai

statement: |
  苯甲醛不含 α-氢。把它与浓 NaOH 水溶液混合并长时间放置。

  写出此时得到的主要有机产物（注意不止一种），并说明这个反应
  与普通的羟醛缩合在机理上有什么本质区别。

answer: |
  得到等摩尔的苯甲酸钠与苯甲醇 —— 即苯甲醛发生了自身氧化还原
  （Cannizzaro 反应，歧化反应）。

  机理：OH⁻ 进攻苯甲醛羰基碳，生成带两个氧负离子的中间体；
  该中间体既能作为氢负离子给体，也能作为受体。
  一分子把氢负离子转移给另一分子苯甲醛，
  自身被氧化为苯甲酸（在碱性条件下成盐），
  接受氢负离子的那分子被还原为苯甲醇。

  与羟醛缩合的本质区别：羟醛缩合需要 α-氢来生成烯醇负离子作为亲核体；
  本反应没有 α-氢可用，于是转为「同一底物既当氧化剂又当还原剂」的歧化路径。

key_quantities:
  - 苯甲酸钠
  - 苯甲醇

skeleton:
  insight: |
    遇到醛酮反应，第一步永远先问：「它有没有 α-氢？」
    有 α-氢，就有烯醇负离子路线（缩合、加成）；
    没有 α-氢，就得换赛道 —— 在浓碱中会走自身氧化还原的歧化路径，
    同一底物既被氧化又被还原。

  pitfalls:
    - trigger: |
        学生按羟醛缩合处理，试图生成 β-羟基醛或 α,β-不饱和醛。
      next_step: |
        让学生数一数苯甲醛 α-碳上的氢原子个数。
      common_wrong_path: |
        默认所有醛都能发生羟醛缩合。

    - trigger: |
        学生只写出一种产物，认为另一分子只是「没反应」。
      next_step: |
        让学生对产物做一次原子与电荷的配平：碳、氢、氧是否都能对上。
      common_wrong_path: |
        只追踪被进攻的那一分子，忽略了提供氢负离子的那一分子。

    - trigger: |
        学生写成氧化还原但把两种产物的物质的量比写成 2:1 或其他比例。
      next_step: |
        让学生按「一分子提供氢负离子给另一分子」逐步配平。
      common_wrong_path: |
        凭印象写比例，不做配平。

    - trigger: |
        学生写出了酸性产物与醇性产物两种，但没说明酸性产物
        在浓碱中以什么形式存在。
      next_step: |
        让学生确认反应体系是强碱性还是酸性，
        据此判断羧基在其中的存在形式。
      common_wrong_path: |
        忽略酸碱条件对产物存在形式的影响。
