id: p002
domain: organic
type: reasoning
concepts:
  - conjugation
  - kinetic-thermodynamic-control
skeleton_source: ai

statement: |
  1,3-丁二烯与 1 当量 HBr 反应。

  (a) 在 -80 °C 下反应，主产物是什么？
  (b) 在 40 °C 下反应，主产物又是什么？

  分别写出两个主产物的结构，并解释温度为何会改变主产物。

answer: |
  (a) -80 °C：主产物为 3-溴-1-丁烯（1,2-加成产物）。
  (b) 40 °C：主产物为 1-溴-2-丁烯（1,4-加成产物）。

  原因：质子化后生成**烯丙基碳正离子**，正电荷分布在 C2 与 C4 两个碳上，
  因此 Br⁻ 有两个进攻位点。

  - 低温：反应基本不可逆，产物由两个位点的**进攻速率**决定，
    正电荷密度较高的 C2 更快被进攻（动力学控制）。
  - 高温：反应可逆，体系有时间达到平衡，最终由**产物稳定性**决定 ——
    1,4-加成产物是内部双键（取代程度更高），更稳定（热力学控制）。

key_quantities:
  - 3-溴-1-丁烯
  - 1-溴-2-丁烯

skeleton:
  insight: |
    共轭二烯的加成先经历一个正电荷离域的烯丙基中间体，
    于是有两个可供进攻的位点。当存在两个可能产物时，
    先问一句「这个反应可逆吗」—— 不可逆看速率，可逆看稳定性。

  pitfalls:
    - trigger: |
        学生只给出一个产物，不区分两个温度条件。
      next_step: |
        让学生把「低温」与「高温」分别翻译成「反应可逆吗」这个问题，
        再据此选择判断依据。
      common_wrong_path: |
        忽略温度对动力学控制与热力学控制的影响，当成同一个反应。

    - trigger: |
        学生认为低温下的主产物是热力学上更稳定的那个。
      next_step: |
        让学生确认低温条件下反应是否来得及达到平衡。
      common_wrong_path: |
        把「低温」与「更稳定」直接画等号。

    - trigger: |
        学生把底物当普通单烯烃处理，只考虑一个双键的加成。
      next_step: |
        让学生标出质子化之后正电荷所在的全部位置。
      common_wrong_path: |
        按孤立烯烃写机理，忽略两个双键的共轭关系。

    - trigger: |
        学生选对了 1,4-加成产物，但说不清它为什么更稳定。
      next_step: |
        让学生比较两个产物中双键碳上各连了几个碳。
      common_wrong_path: |
        只说「共轭更稳定」，不落到双键取代程度上。
