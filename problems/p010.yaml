id: p010
domain: organic
type: reasoning
skeleton_source: ai

statement: |
  环己-2-烯酮（α,β-不饱和酮）与甲基溴化镁反应。

  (a) 不加任何添加剂时，主产物是什么？
  (b) 先加入催化量 CuI 再加甲基溴化镁，主产物又是什么？

  写出两个主产物的结构，并解释铜盐为什么能改变产物。

answer: |
  (a) 不加 CuI：发生 1,2-加成，主产物为 1-甲基环己-2-烯醇
      （甲基加到羰基碳上，保留双键）。
  (b) 加 CuI：发生 1,4-共轭加成，主产物为 3-甲基环己酮
      （甲基加到 β-碳上，双键移到羰基，得到饱和酮）。

  原因：α,β-不饱和酮有两个亲电位点 —— 羰基碳与 β-碳。
  甲基溴化镁属**硬**亲核体，优先进攻电荷更集中的羰基碳（1,2-加成）；
  加入 CuI 后生成有机铜物种，亲核性变**软**，
  转为进攻共轭体系的 β-碳（1,4-加成）。

key_quantities:
  - 1-甲基环己-2-烯醇
  - 3-甲基环己酮

skeleton:
  insight: |
    面对共轭烯酮，先找两个亲电位点：羰基碳和 β-碳。
    进攻哪一个由亲核试剂的「软硬」决定 —— 硬亲核体走羰基，
    软亲核体走共轭位点。改变试剂的软硬，就改变了产物。

  pitfalls:
    - trigger: |
        学生两种条件给出同一产物，认为铜盐只是加快反应。
      next_step: |
        让学生说明铜盐把格氏试剂转变成了什么类型的物种，
        以及该物种的亲核性有何变化。
      common_wrong_path: |
        把添加剂当作单纯的速率调节手段。

    - trigger: |
        学生把 1,4-加成产物画成「甲基加在 β-碳上、双键位置不变」。
      next_step: |
        让学生对加成后的中间体做一次电荷与双键的重新分配，
        确认双键最终移到哪里。
      common_wrong_path: |
        只搬动取代基，不追踪电子的转移与双键的位移。

    - trigger: |
        学生一律写成 1,2-加成，不考虑试剂性质。
      next_step: |
        让学生比较羰基碳与 β-碳上各自的电荷密度，
        再判断硬亲核体更倾向于哪一个。
      common_wrong_path: |
        默认格氏试剂只进攻羰基。

    - trigger: |
        学生答对了 1,4-产物，但把它描述成「甲基加到了羰基氧上」。
      next_step: |
        让学生标出 β-碳的位置，并确认甲基与氢分别落在哪个碳上。
      common_wrong_path: |
        混淆共轭加成的位点编号。
