id: p004
domain: organic
type: reasoning
concepts:
  - aldol-condensation
  - enolate-chemistry
  - carbonyl-addition
skeleton_source: ai

statement: |
  将苯甲醛与苯乙酮溶于乙醇，加入稀 NaOH 水溶液并稍加热。

  写出主产物的结构，并说明为什么这个反应能得到单一主产物，
  而不是两种酮各自缩合的混合物。

answer: |
  主产物为查尔酮（1,3-二苯基-2-丙烯-1-酮）。

  机理：碱夺取苯乙酮 α-碳上的氢，生成烯醇负离子；
  该负离子进攻苯甲醛的羰基碳，得到 β-羟基酮；
  随后脱水形成 C=C 与羰基共轭的体系。

  选择性的来源：苯甲醛的 α-碳上没有氢，**无法形成烯醇负离子**，
  因此只能充当被进攻的亲电体；苯乙酮既有 α-氢又是较软的亲核体，
  于是交叉缩合占了主导。

key_quantities:
  - 查尔酮
  - 1,3-二苯基-2-丙烯-1-酮

skeleton:
  insight: |
    交叉缩合能不能做干净，先看「谁有 α-氢」。
    没有 α-氢的羰基化合物只能当亲电体，有 α-氢的当亲核体 ——
    角色一旦不重叠，混合物问题就基本消失了。
    另外，若缩合产物还能继续脱水形成共轭体系，反应会被显著推动。

  pitfalls:
    - trigger: |
        学生让苯甲醛自身缩合。
      next_step: |
        让学生数一数苯甲醛 α-碳上连了几个氢。
      common_wrong_path: |
        看到两个羰基化合物就默认都能生成亲核物种。

    - trigger: |
        学生停在 β-羟基酮，没有继续脱水。
      next_step: |
        让学生检查脱水后的产物中，双键与羰基是否处于共轭关系。
      common_wrong_path: |
        写出加成产物即收工，忽略后续的脱水驱动力。

    - trigger: |
        学生让苯乙酮自身缩合，答成两种产物之一。
      next_step: |
        让学生比较「苯乙酮自身缩合」与「苯乙酮进攻苯甲醛」
        两条路中，哪一条的中间体更稳定。
      common_wrong_path: |
        忽略两个羰基化合物亲电性的差异。

    - trigger: |
        学生答对产物，但把碱性条件写成了酸性条件。
      next_step: |
        让学生确认稀 NaOH 的作用是夺取 α-氢还是质子化羰基。
      common_wrong_path: |
        把醛酮缩合与酸催化羟醛加成混为一谈。
