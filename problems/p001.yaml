id: p001
domain: organic
type: reasoning

statement: |
  2,3-二甲基-2,3-丁二醇（频哪醇，pinacol）在稀硫酸中加热，
  发生重排并生成单一主产物。

  请写出该主产物的结构，并说明驱动这次重排的根本原因。

answer: |
  主产物：频哪酮（3,3-二甲基-2-丁酮，pinacolone）。

  机理：
  1. 一个羟基被质子化，随后脱水，生成叔碳正离子；
  2. 相邻碳上的甲基带着成键电子对发生 1,2-迁移，
     正电荷转移到带羟基的碳上；
  3. 该碳正离子受相邻氧原子的孤对电子稳定（氧鎓共振）；
  4. 去质子化得到酮。

  推动力：碳正离子的稳定性（叔碳正离子，以及氧鎓共振稳定）。

# ---------------------------------------------------------------------------
# C1 黑名单：只放「最终答案」，绝不放中间机理。
#
# 机理（碳正离子、1,2-迁移、氧鎓）正是要引导学生自己走出来的内容。
# 若把机理步骤列入黑名单，前 3 层提示将无法推进 —— 见 docs/skeleton-format.md。
# ---------------------------------------------------------------------------
key_quantities:
  - 频哪酮
  - 3,3-二甲基-2-丁酮
  - pinacolone

skeleton:
  insight: |
    邻二醇在酸中会脱水生成碳正离子，随后发生 1,2-迁移。
    迁移的方向不取决于基团大小，而取决于「迁移后碳正离子是否更稳定」。

  pitfalls:
    - trigger: |
        学生认为两个羟基都会脱水，试图写成双键（烯烃）产物。
      next_step: |
        把注意力拉回「只有一个羟基被质子化并脱水」，
        让学生确认第二个羟基此时以什么形式存在、为什么它不走。
      common_wrong_path: |
        把邻二醇直接当作脱水成二烯来处理。

    - trigger: |
        学生写出了碳正离子，但停在那里，不认为还需要发生骨架变化。
      next_step: |
        让学生检查该碳正离子相邻碳上连了哪些基团，
        并比较「迁移前」与「迁移后」碳正离子的稳定性。
      common_wrong_path: |
        认为叔碳正离子已经足够稳定，因此不需要重排。

    - trigger: |
        学生认为发生迁移的是羟基，把「重排」理解成官能团整体搬家。
      next_step: |
        让学生确认迁移基团必须带着自己的成键电子对整体迁移到缺电子碳上，
        并追问：迁移完成后，正电荷落在哪个碳上？
      common_wrong_path: |
        混淆「基团迁移」与「官能团转移」。

    - trigger: |
        学生给出了正确产物，但把推动力说成「分子变得更稳定了」这类宏观说法。
      next_step: |
        要求学生逐步标出每一个中间体，
        并指出每一步究竟由哪个中间体的什么性质在驱动。
      common_wrong_path: |
        用宏观热力学直觉替代中间体稳定性分析。
