id: p007
domain: organic
type: reasoning
concepts:
  - carbocation-rearrangement
  - carbocation-stability
skeleton_source: ai

statement: |
  3,3-二甲基-1-丁烯与 HCl 反应，实验给出的主产物并不是按马氏规则
  直接把氯加在双键上的那个化合物。

  写出主产物的结构，并解释为什么实际产物会「偏离」马氏规则。

answer: |
  主产物为 2-氯-2,3-二甲基丁烷。

  过程：质子加到末端碳上，生成仲碳正离子；
  该碳正离子相邻的叔碳上有一个甲基，甲基带着成键电子对发生 1,2-迁移，
  正电荷转移到原来带甲基的碳上，得到更稳定的叔碳正离子；
  Cl⁻ 随后进攻该碳。

  所谓「偏离」只是表象：马氏规则的本质是生成更稳定的碳正离子，
  而重排恰恰使其更稳定，因此重排产物才是真正的马氏产物。

key_quantities:
  - 2-氯-2,3-二甲基丁烷

skeleton:
  insight: |
    马氏规则的本质不是「氢加在含氢多的碳上」，而是「经过更稳定的正离子中间体」。
    因此出现碳正离子后必须多问一句：相邻碳上有没有可迁移的基团？
    迁移后的正离子是否更稳定？若更稳定，主产物就会是重排后的那个。

  pitfalls:
    - trigger: |
        学生直接按双键两端的氢原子数决定氯的位置，不考虑中间体。
      next_step: |
        让学生先写出质子化后正电荷落在哪个碳上，再判断该中间体是否稳定。
      common_wrong_path: |
        把马氏规则当作背下来的口诀而不是稳定性推论。

    - trigger: |
        学生写出了碳正离子，但没有检查相邻碳上的基团能否迁移。
      next_step: |
        让学生列出该碳正离子的相邻碳上分别连了什么基团，
        并判断哪一个是可迁移的。
      common_wrong_path: |
        认为碳正离子一旦生成就只等着被亲核试剂进攻。

    - trigger: |
        学生让氢发生迁移而不是甲基迁移，得到不同的骨架。
      next_step: |
        让学生分别写出氢迁移与甲基迁移后的正离子结构，
        比较两者的取代程度。
      common_wrong_path: |
        默认「越小的基团越容易迁移」。

    - trigger: |
        学生承认有重排，但仍把重排产物说成「副产物」。
      next_step: |
        让学生比较两个可能中间体的稳定性，据此判断哪条路径占主导。
      common_wrong_path: |
        把重排当作次要的副反应处理。
