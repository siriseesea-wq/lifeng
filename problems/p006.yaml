id: p006
domain: organic
type: reasoning
skeleton_source: ai

statement: |
  环戊二烯与马来酸酐在乙醚中于室温反应，生成一个双环加成产物。

  该产物的两个可能立体异构体中，哪一个是主产物？说明你的判断依据。

answer: |
  主产物为内型（endo）异构体 —— 即酸酐环朝向双环体系的桥端一侧。

  依据：该反应为 Diels–Alder 反应，过渡态是六元环状的协同过程。
  两个立体异构过渡态的能量差很小，决定因素不是空间位阻，
  而是**次级轨道相互作用**：内型过渡态中，亲双烯体羰基的 π* 轨道
  与二烯的 π 体系之间能发生额外的同侧重叠，使过渡态能量降低。
  室温、不可逆条件下由动力学控制，故内型占优。

key_quantities:
  - 内型
  - endo

skeleton:
  insight: |
    Diels–Alder 反应的两个立体异构产物来自六元环过渡态中两端基团的
    同侧或异侧排布。判断哪一个过渡态更稳定时，不要先看空间位阻 ——
    先看两端 π 体系之间能否发生额外的同侧轨道重叠。

  pitfalls:
    - trigger: |
        学生直接按空间位阻判断，选择了取代基彼此远离的那个过渡态。
      next_step: |
        让学生画出一个六元环过渡态，标出两端 π 体系的空间取向，
        再问「同侧还是异侧能产生额外重叠」。
      common_wrong_path: |
        把普通开链反应的位阻直觉搬到环状协同过渡态上。

    - trigger: |
        学生认为该反应是分步的自由基或离子过程。
      next_step: |
        让学生确认反应是否只需要一步、有无中间体，
        并检查产物中双键的相对位置是否符合六元环协同成环的结果。
      common_wrong_path: |
        用极性加成或自由基链的框架处理周环反应。

    - trigger: |
        学生给出了正确的相对构型，但说不清这个选择性在什么条件下成立。
      next_step: |
        让学生确认该反应在室温下是否可逆。
      common_wrong_path: |
        把动力学控制与热力学控制的结论互相套用。

    - trigger: |
        学生把产物双键的位置画错，答成不在环内的异构体。
      next_step: |
        让学生对照反应物，逐个追踪六个参与成环的碳原子去向。
      common_wrong_path: |
        只画出骨架而忽略双键位置随协同迁移而移动。
