id: p005
domain: organic
type: reasoning
skeleton_source: ai

statement: |
  2-甲基-2-丁烯与 HBr 反应。

  (a) 不加过氧化物时，主产物是什么？
  (b) 加入少量过氧化物（如过氧化苯甲酰）后，主产物又是什么？

  写出两个主产物的结构并解释差别。

answer: |
  (a) 无过氧化物：主产物为 2-溴-2-甲基丁烷（离子型加成，经叔碳正离子）。
  (b) 有过氧化物：主产物为 2-溴-3-甲基丁烷（自由基链式加成）。

  原因：过氧化物使 Br⁻/HBr 体系转为 Br· 自由基链过程。
  链增长的第一步是 Br· 加到双键上，取向由**生成的碳自由基稳定性**决定 ——
  Br· 加到取代较少的碳上，使未成对电子落在取代较多的碳上（叔自由基）。
  这与离子型加成中「碳正离子更稳定」的判断方向恰好相反，
  因此溴最终落在取代较少的一端。

key_quantities:
  - 2-溴-2-甲基丁烷
  - 2-溴-3-甲基丁烷

skeleton:
  insight: |
    加溴化氢有两种完全不同的机理：极性的离子型过程，和过氧化物引发的
    自由基链过程。判断取向时，先问「关键中间体是正离子还是自由基」——
    两者都偏好取代较多的碳，但**取代基最终落在哪一端**恰好相反。

  pitfalls:
    - trigger: |
        学生两种条件给出同一个产物。
      next_step: |
        让学生指出过氧化物在链引发步骤中把 HBr 变成了什么物种。
      common_wrong_path: |
        忽略过氧化物改变了活性中间体的种类。

    - trigger: |
        学生知道是自由基过程，但仍按碳正离子的逻辑判断取代基落点。
      next_step: |
        让学生画出链增长第一步之后的自由基结构，
        并比较两种可能位置上的自由基稳定性。
      common_wrong_path: |
        把自由基稳定性与碳正离子稳定性的落点方向混为一谈。

    - trigger: |
        学生把过氧化物的作用说成「催化剂，加快反应」。
      next_step: |
        让学生写出链引发、链增长、链终止三步，并确认产物的结构由哪一步决定。
      common_wrong_path: |
        只描述速率变化，不涉及区域选择性的改变。

    - trigger: |
        学生给出的自由基位置上，未成对电子落在伯碳上。
      next_step: |
        让学生比较伯、仲、叔自由基的相对稳定性。
      common_wrong_path: |
        只考虑空间位阻，不比较自由基的取代程度。
