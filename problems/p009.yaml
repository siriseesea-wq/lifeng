id: p009
domain: organic
type: reasoning
concepts:
  - hydroboration
  - steric-effects
skeleton_source: ai

statement: |
  1-甲基环己烯分别经历下面两条路线：

  (a) 先与 BH₃·THF 反应，再用 H₂O₂/NaOH 氧化；
  (b) 在稀硫酸中催化水合。

  写出两条路线各自的主产物，并解释为什么羟基落在不同的碳上。

answer: |
  (a) 主产物为 2-甲基环己醇 —— 羟基落在取代较少的碳上。
  (b) 主产物为 1-甲基环己醇 —— 羟基落在取代较多的碳上。

  原因：
  (a) 硼氢化是协同的**顺式加成**，硼优先加到空间位阻较小的一端；
      随后的氧化把硼原位换成羟基，因此羟基位置由「硼加在哪」决定，
      与正离子稳定性无关。
  (b) 酸催化水合经过碳正离子中间体，羟基的位置由**哪个碳正离子更稳定**
      决定，因此落在能形成叔正离子的那个碳上。

key_quantities:
  - 2-甲基环己醇
  - 1-甲基环己醇

skeleton:
  insight: |
    同一底物、同一「加水」的净结果，却能得到两种不同的醇 ——
    区别只在中间体的类型。先判断路径是协同过程还是经过正离子：
    协同过程看空间效应，离子型过程看正离子稳定性。

  pitfalls:
    - trigger: |
        学生两条路线给出同一个醇。
      next_step: |
        让学生分别写出两条路线的关键中间体（一条有中间体，一条没有）。
      common_wrong_path: |
        把「加水」当作同一种反应处理，不区分机理。

    - trigger: |
        学生把硼氢化也说成经正离子中间体。
      next_step: |
        让学生确认该步骤是一步完成还是分步进行，
        并解释为什么它表现出顺式加成。
      common_wrong_path: |
        用离子型机理套协同反应。

    - trigger: |
        学生认为硼加在取代较多的碳上，理由是「更稳定」。
      next_step: |
        让学生比较双键两端的空间拥挤程度，
        并考虑硼试剂本身体积较大这一事实。
      common_wrong_path: |
        把碳正离子稳定性的判断标准直接搬到协同加成上。

    - trigger: |
        学生答对了位置，但把两条路线的产物写反了。
      next_step: |
        让学生对每条路线各自标注「羟基所在碳上连了几个碳」。
      common_wrong_path: |
        靠记忆而不是靠机理判断归属。
