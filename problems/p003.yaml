id: p003
domain: organic
type: reasoning
skeleton_source: ai

statement: |
  对硝基甲苯（1-甲基-4-硝基苯）在混酸中继续发生硝化反应。

  主要产物是哪一个？写出其结构并说明理由。

answer: |
  主要产物为 1-甲基-2,4-二硝基苯（2,4-二硝基甲苯），
  即新引入的硝基进入甲基的邻位。

  理由：甲基是给电子基（活化基团），使苯环电子密度升高，
  并把邻、对位活化。对位已被硝基占据，因此新取代基进入邻位。
  硝基是强吸电子基，本身钝化苯环并使间位相对活化，
  但在甲基的强活化面前不占主导。

key_quantities:
  - 1-甲基-2,4-二硝基苯
  - 2,4-二硝基甲苯

skeleton:
  insight: |
    苯环上已有两个取代基时，定位由**最强活化基**主导。
    先判断每个基团是活化还是钝化，再看它把新取代基送往哪个位置，
    最后检查那个位置是否空着。

  pitfalls:
    - trigger: |
        学生看到有硝基就认为新取代基会进入硝基的间位。
      next_step: |
        让学生分别判断甲基与硝基各自的定位能力，
        再比较哪一个对环电子密度的影响更大。
      common_wrong_path: |
        挑出吸电子基作为定位依据，忽略另一个取代基的活化作用。

    - trigger: |
        学生选了对位，但没有察觉对位已经被占。
      next_step: |
        让学生回到结构式，逐个标出还有哪些位置是空的。
      common_wrong_path: |
        只记「甲基送邻对位」，不检查该位置是否可取代。

    - trigger: |
        学生认为两个取代基会「各自定位」产生两种主产物。
      next_step: |
        让学生比较两个基团对反应速率的影响强弱，
        据此判断哪一个决定主产物。
      common_wrong_path: |
        把两个基团的定位效应等权处理。

    - trigger: |
        学生答对了位置，但只写「甲基是邻对位定位基」而不涉及电子效应。
      next_step: |
        让学生说明甲基通过什么方式提高环上电子密度。
      common_wrong_path: |
        停留在口诀层面，不解释为什么。
